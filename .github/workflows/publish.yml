# SPEC §Deployment / M4 E8: publish dist/ to GitHub Pages on tagged release.
# Committed and inert until the owner creates the remote; goes live with
# `git tag v1.0 && git push origin main --tags` + Pages source = Actions.
# `base: './'` in vite.config.ts makes the artifact host-agnostic, so the
# project-pages subpath needs no configuration.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build # tsc --noEmit + vite build
      - run: node scripts/load-budget.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
